name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Least privilege for the workflow token. This pipeline only reads the repo
# and deploys to Fly with its own secret; it never writes back to GitHub, so
# the default broad GITHUB_TOKEN scopes are unnecessary — and the deploy job
# below holds FLY_API_TOKEN, so a narrow token limits the blast radius if a
# step is ever compromised.
permissions:
  contents: read

jobs:
  # Gate the deploy on typecheck + lint so a broken push to main can't ship.
  # (react-hooks/rules-of-hooks is an error here — the class of bug that
  # white-screened prod once.) The frontend deploys via Vercel's own git
  # integration and is not gated by this workflow.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Same offline checks the PR runs. A rule that decides which pets
      # get expired, or whether anyone hears that ingestion died, should
      # not reach production on the strength of it having compiled.
      - run: pnpm check

  server:
    name: server → fly.io
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: this action is pinned to the mutable @master ref, so a
      # compromise of it runs in the job that holds FLY_API_TOKEN. Fly's
      # docs use @master, but for supply-chain safety pin this to a specific
      # release tag or commit SHA once you've picked one you trust
      # (e.g. superfly/flyctl-actions/setup-flyctl@<sha>). Left as-is here
      # rather than guessing a SHA that could break the deploy.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
