name: typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Offline fixture checks — no database, no network, no secrets.
      # They guard rules whose failure mode is silent: expiring a real
      # Kyiv pet, or an ingest alert that never fires.
      - run: pnpm check
